name: "Bug"
description: A sample is broken, or install.sh or the host app is. For a wrong README, PROMPT or CHECKS, use "Doc bug"; for the framework itself, open it in rust-off-rails/rustoffrails.
labels: ["bug"]
body:
  - type: dropdown
    id: sample
    attributes:
      label: Sample
      options:
        - auth-core
        - auth-magic-link
        - auth-password
        - auth-totp
        - dev-dashboard
        - dev-mailbox
        - jobs
        - jobs-dashboard
        - mailer
        - realtime
        - webhooks
        - host or tools
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Framework version, description: "`offrails version`, or the first line of .offrails/VERSION", placeholder: "0.7.5" }
    validations: { required: true }
  - type: input
    id: system
    attributes: { label: System, placeholder: "macOS 26 on M2, Rust 1.92 / Ubuntu 24.04 / Windows 11" }
  - type: textarea
    id: what
    attributes:
      label: What's wrong
      description: "What you ran, what happened, what you expected. Paste the command and its output in a code block. Remove secrets."
    validations: { required: true }
  - type: textarea
    id: fix
    attributes: { label: Cause or fix, description: "If you or your agent found it: the file and line, or a suggested change." }
