name: "Doc bug"
description: A sample's README, PROMPT.md, CHECKS.md or comments are wrong, outdated or unclear.
labels: ["doc-bug"]
body:
  - type: input
    id: file
    attributes: { label: File and section, placeholder: "samples/jobs/README.md#unique-jobs" }
    validations: { required: true }
  - type: textarea
    id: problem
    attributes: { label: What's wrong, description: "Include the evidence: the compiler error, the crate version, the docs.rs link." }
    validations: { required: true }
  - type: textarea
    id: fix
    attributes: { label: Suggested fix }
