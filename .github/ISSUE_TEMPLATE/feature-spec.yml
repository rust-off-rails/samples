name: "Sample idea (as a spec)"
description: Propose a new sample, or something an existing one should do, the way you'd write a product spec.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes: { label: The problem, description: "Which apps need this and why?" }
    validations: { required: true }
  - type: textarea
    id: prior
    attributes: { label: How others do it, description: "Rails, Phoenix/Elixir, Laravel, Django… links welcome." }
  - type: textarea
    id: acceptance
    attributes: { label: What "done" looks like, description: "Acceptance criteria an agent could test, including the CHECKS.md rows it would need." }
