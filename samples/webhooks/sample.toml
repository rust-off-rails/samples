// ----- webhooks -----

/// A server-to-server POST with a raw body, as a webhook sender makes it: no cookies, no
/// `Sec-Fetch-Site`, no `Origin`, only the headers given.
pub async fn post_raw(&self, path: &str, headers: &[(&str, &str)], body: &[u8]) -> TestResponse {
    let mut builder = Request::builder().method(Method::POST).uri(path);
    for (name, value) in headers {
        builder = builder.header(*name, *value);
    }
    let request = builder.body(Body::from(body.to_vec())).expect("request");
    let response = self
        .router
        .clone()
        .oneshot(request)
        .await
        .expect("infallible");
    let (parts, body) = response.into_parts();
    let bytes = body.collect().await.expect("body").to_bytes();
    TestResponse {
        status: parts.status,
        headers: parts.headers,
        body: String::from_utf8_lossy(&bytes).into_owned(),
    }
}

