text = '''
/// Inbound webhook signing secrets, one per provider (.offrails/guides/security.md#csrf). A
/// provider without a secret has no route.
#[derive(Clone, Default)]
pub struct WebhooksConfig {
    secrets: Vec<(crate::kernel::webhooks::Provider, WebhookSecret)>,
}

/// A signing secret. Its Debug never shows it.
#[derive(Clone)]
struct WebhookSecret(String);

impl fmt::Debug for WebhookSecret {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        f.write_str("[redacted]")
    }
}

// SECURITY: Debug is an allowlist: it names which providers are configured and never a secret
// (test: webhook_secrets_never_reach_debug_output).
impl fmt::Debug for WebhooksConfig {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        f.debug_struct("WebhooksConfig")
            .field("providers", &self.providers())
            .finish()
    }
}

impl WebhooksConfig {
    /// APP: the shortest secret accepted. `openssl rand -hex 32` makes 64 characters.
    pub const MIN_SECRET_LEN: usize = 16;

    /// No provider configured: no webhook route answers. What the test config uses.
    pub fn none() -> Self {
        Self::default()
    }

    /// `APP_WEBHOOK_GITHUB_SECRET`, `APP_WEBHOOK_STRIPE_SECRET`, one per provider.
    pub fn from_env() -> anyhow::Result<Self> {
        Self::from_lookup(|name| std::env::var(name).ok())
    }

    /// `from_env` over any lookup (tests pass a closure instead of touching the environment).
    pub fn from_lookup(get: impl Fn(&str) -> Option<String>) -> anyhow::Result<Self> {
        let mut secrets = Vec::new();
        let mut invalid: Vec<String> = Vec::new();
        for provider in crate::kernel::webhooks::Provider::ALL {
            let name = provider.env_var();
            let Some(value) = get(&name).map(|v| v.trim().to_owned()).filter(|v| !v.is_empty())
            else {
                continue;
            };
            if value.len() < Self::MIN_SECRET_LEN {
                invalid.push(format!(
                    "{name} (at least {} characters)",
                    Self::MIN_SECRET_LEN
                ));
            } else {
                secrets.push((provider, WebhookSecret(value)));
            }
        }
        if !invalid.is_empty() {
            anyhow::bail!("invalid env vars: {} (see .env.example)", invalid.join(", "));
        }
        Ok(Self { secrets })
    }

    /// Secrets for the given providers (tests).
    pub fn with(secrets: &[(crate::kernel::webhooks::Provider, &str)]) -> Self {
        Self {
            secrets: secrets
                .iter()
                .map(|(provider, secret)| (*provider, WebhookSecret((*secret).to_owned())))
                .collect(),
        }
    }

    /// The provider's signing secret, when configured.
    pub fn secret(&self, provider: crate::kernel::webhooks::Provider) -> Option<&[u8]> {
        self.secrets
            .iter()
            .find(|(p, _)| *p == provider)
            .map(|(_, secret)| secret.0.as_bytes())
    }

    /// The slugs of the configured providers.
    pub fn providers(&self) -> Vec<&'static str> {
        self.secrets.iter().map(|(p, _)| p.slug()).collect()
    }
}

'''

