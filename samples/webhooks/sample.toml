# samples/webhooks/sample.toml: the format is samples/FORMAT.md.
name = "webhooks"
version = "0.7.0"
summary = "Signed inbound webhooks: POST /webhooks/{provider} verifies the HMAC over the raw body (GitHub and Stripe schemes), refuses stale timestamps, stores each event once so a replay is a no-op, and does the work in a job"
depends_on = ["jobs"]
extracted_from = "Rust off Rails apps"

# Run in the app root, one per line, never with a version (cargo add picks it; read Cargo.lock).
crates = [
  "hmac",
  "constant_time_eq",
]

# Every file under files/ is copied to the same path in the app.

